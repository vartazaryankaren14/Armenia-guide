<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Armenia Guide</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f6f3ed;--white:#fff;--text:#24221f;--muted:#77736c;--line:#e5e0d8;--accent:#8f3d32}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:85px}
.app{max-width:650px;margin:auto}
.hero{min-height:330px;padding:22px 18px 28px;color:#fff;border-radius:0 0 30px 30px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.72)),url("https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?auto=format&fit=crop&w=1400&q=90") center/cover}
.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:12px;letter-spacing:2px;font-weight:700}.lang{border:1px solid #ffffff55;background:#ffffff22;color:#fff;border-radius:22px;padding:9px 12px}
.eyebrow{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;opacity:.8;margin-bottom:10px}.hero h1{font-size:42px;line-height:1;letter-spacing:-2px;margin-bottom:12px}.hero p{font-size:14px;line-height:1.5;max-width:390px}
.content{padding:22px 16px}.search{display:flex;gap:9px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 15px;margin-bottom:24px}.search input{border:0;outline:0;width:100%;font-size:14px;background:transparent}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:13px}.section-head h2{font-size:21px}.section-head span{font-size:11px;color:var(--muted)}
.categories{display:flex;gap:8px;overflow:auto;scrollbar-width:none;margin-bottom:27px}.categories::-webkit-scrollbar{display:none}.cat{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:22px;padding:10px 13px;font-size:12px}.cat.active{background:var(--text);color:#fff;border-color:var(--text)}
.card{background:#fff;border:1px solid var(--line);border-radius:23px;overflow:hidden;margin-bottom:22px}.photo{height:235px;background:#ddd center/cover no-repeat;position:relative}.badge{position:absolute;top:13px;left:13px;background:#ffffffe8;border-radius:20px;padding:8px 10px;font-size:10px;font-weight:600}.save{position:absolute;right:13px;top:13px;width:38px;height:38px;border:0;border-radius:50%;background:#ffffffe8;font-size:20px}.body{padding:19px}.title-row{display:flex;justify-content:space-between;gap:10px}.title{font-size:23px;line-height:1.08;margin-bottom:6px}.loc{font-size:11px;color:var(--muted);margin-bottom:13px}.rating{background:#f3eee4;padding:7px 9px;border-radius:10px;font-size:11px;height:max-content;white-space:nowrap}.desc{font-size:13px;line-height:1.58;color:#57534c;margin-bottom:16px}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.info div{background:var(--bg);border-radius:12px;padding:11px}.label{font-size:9px;color:var(--muted);margin-bottom:4px}.value{font-size:11px;font-weight:600;line-height:1.35}.tip{border-left:3px solid var(--accent);padding:10px 12px;background:#faf7f1;border-radius:0 12px 12px 0;font-size:12px;line-height:1.5;margin-bottom:16px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:12px;padding:13px 8px;font-size:11px}.primary{background:var(--text);color:#fff}.secondary{background:var(--bg);color:var(--text)}
.nearby{font-size:12px;color:#57534c;line-height:1.55;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:22px}
.empty{display:none;text-align:center;color:var(--muted);padding:35px 10px}.bottom{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);max-width:650px;width:100%;background:#fffffff5;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 7px calc(9px + env(safe-area-inset-bottom))}.nav{border:0;background:transparent;color:var(--muted);font-size:10px}.nav.active{color:var(--accent);font-weight:700}.nav b{display:block;font-size:19px;margin-bottom:3px}.toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,20px);background:var(--text);color:#fff;border-radius:22px;padding:11px 16px;font-size:11px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.hero h1{font-size:38px}.content{padding-left:13px;padding-right:13px}}
</style>
</head>
<body>
<div class="app">
<section class="hero">
  <div class="top"><div class="logo">ARMENIA GUIDE</div><button class="lang" onclick="toast('🌍 Язык добавим следующим этапом')">🇷🇺 Русский</button></div>
  <div><div class="eyebrow">Откройте · Исследуйте · Почувствуйте</div><h1>Открой<br>Армению.</h1><p>Путеводитель по местам, вкусам и впечатлениям, которые действительно стоит увидеть.</p></div>
</section>
<main class="content">
  <div class="search">🔎<input id="search" placeholder="Поиск по Армении..." oninput="render()"></div>
  <div class="section-head"><h2>Исследовать</h2><span id="count"></span></div>
  <div class="categories" id="categories"></div>
  <div id="cards"></div>
  <div class="empty" id="empty">Ничего не найдено. Попробуйте другое название.</div>
</main>
</div>
<nav class="bottom">
  <button class="nav active" onclick="nav(this)"><b>⌂</b>Главная</button>
  <button class="nav" onclick="mapAll()"><b>🗺️</b>Карта</button>
  <button class="nav" onclick="toast('❤️ Сохранённые места появятся здесь')"><b>♡</b>Избранное</button>
  <button class="nav" onclick="toast('☰ Дополнительные разделы появятся позже')"><b>☰</b>Ещё</button>
</nav>
<div class="toast" id="toast"></div>
<script>
const places = [{"id": "garni_001", "category": "Достопримечательности", "name": "Храм Гарни", "short": "Единственный сохранившийся в Армении языческий храм греко-римского типа, построенный в I веке н. э.", "description": "Храм Гарни — один из главных исторических памятников Армении. Он был построен в 77 году при царе Трдате I и посвящён богу света и солнца Михру. Храм является единственным сохранившимся сооружением языческого периода Армении. Он построен из серого базальта и стоит на 24 колоннах. На территории комплекса также сохранились остатки римской бани с мозаичным полом, королевской летней резиденции и церкви VII века.", "region": "Котайкская область", "address": "село Гарни, Котайкская область, Армения", "lat": "40.112223", "lon": "44.730374", "rating": "4.8", "price": "стоимость входа 1 500 ֏, льготный билет 750 ֏ и бесплатный вход для детей до 12 лет; экскурсии нужно бронировать заранее.", "hours": "в летнее время с 10:00 до 21:30, в зимнее время с 10:00 до 17:00", "best_time": "Утро или ближе к вечеру; весна и осень особенно приятны для прогулки по ущелью", "duration": "1,5–2 часа на Храм Гарни; 4–5 часов, если объединить Храм Гарни, Монастырь Гегард и Симфонию камней", "how_to": "На автомобиле/такси из Еревана — около 30 км, 40-50 мин.", "nearby": "Симфония камней; Монастырь Гегард", "tip": "Гарни — место, где история и природа встречаются в одном маршруте. Посмотрите древний храм, спуститесь в ущелье к базальтовой «Симфонии камней», а затем отправляйтесь в Гегард.", "yandex": "https://yandex.ru/maps/-/CTHAAZNc", "site": "", "photos": ["https://www.google.com/url?sa=t&source=web&rct=j&url=https%3A%2F%2Fru.wikipedia.org%2Fwiki%2F%25D0%2593%25D0%25B0%25D1%2580%25D0%25BD%25D0%25B8_(%25D1%2585%25D1%2580%25D0%25B0%25D0%25BC)&ved=0CBYQjRxqFwoTCKDQvpLawZYDFQAAAAAdAAAAABA8&opi=89978449", "https://35photo.pro/photos_main/1751/8758812.jpg", "https://7d9e88a8-f178-4098-bea5-48d960920605.selcdn.net/143de0b9-4073-46d8-bb05-7faacda1eb4c/"], "premium": "Нет", "status": "Готово"}, {"id": "geghard_001", "category": "Достопримечательности", "name": "Монастырь Гегард", "short": "Средневековый монастырский комплекс, частично высеченный в скалах Азатской долины и внесённый в список Всемирного наследия ЮНЕСКО.", "description": "Гегард — один из самых впечатляющих монастырских комплексов Армении. Согласно традиции, монастырь был основан в IV веке святым Григорием Просветителем после принятия христианства в качестве государственной религии Армении. В ранний период он назывался Айриванк — «пещерный монастырь». Основной архитектурный комплекс сформировался в XIII веке. Многие церкви и усыпальницы комплекса высечены непосредственно в скале, а сам монастырь окружён высокими скалами Азатской долины.", "region": "Котайкская область", "address": "Азатская долина, Котайкская область, Армения", "lat": "40.140476", "lon": "44.818420", "rating": "2026-09-04 00:00:00", "price": "Бесплатно", "hours": "в летнее время с 9:00 до 18:30, в зимнее время с 9:00 до 17:00", "best_time": "Утро или вторая половина дня; особенно красиво, когда солнечный свет попадает на скалы долины", "duration": "1,5–2 часа на Монастырь Гегард; 4–5 часов, если объединить Храм Гарни, Монастырь Гегард и Симфонию камней", "how_to": "На автомобиле/такси из Еревана — около 30 км, 40-50 мин.", "nearby": "Храм Гарни; Симфония камней", "tip": "Обязательно зайдите внутрь скальных помещений монастыря — именно они делают Гегард особенным. Также,  пройдите за территорию монастыря к пещерам — там можно увидеть необычные скальные проходы и помещения. Будьте осторожны: некоторые участки могут быть неровными и скользкими, поэтому выбирайте удобную обувь и не спешите. Советуем посещать монастырь вместе с Храмом Гарни и Симфонией камней.", "yandex": "https://yandex.ru/maps/-/CTHA4-8o", "site": "", "photos": ["https://www.google.com/url?sa=t&source=web&rct=j&url=https%3A%2F%2Fru.wikipedia.org%2Fwiki%2F%25D0%2593%25D0%25B5%25D0%25B3%25D0%25B0%25D1%2580%25D0%25B4&ved=0CBYQjRxqGAoTCPiBqtDfwZYDFQAAAAAdAAAAABC6AQ&opi=89978449", "https://irecommend.ru/sites/default/files/imagecache/copyright1/user-images/687691/g6e7cXchEVDNk56caFGc8Q.jpg", "https://happyholidays.am/wp-content/uploads/2026/05/gehgard.webp"], "premium": "Нет", "status": "Готово"}];
let selected = "Все";
const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

const cats = ["Все", ...new Set(places.map(p=>p.category).filter(Boolean))];

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function toast(text){const el=document.getElementById("toast");el.textContent=text;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800)}
function maps(p){
  if(p.yandex){ if(tg?.openLink) tg.openLink(p.yandex); else window.open(p.yandex,"_blank"); return; }
  if(p.lat&&p.lon){const u=`https://yandex.ru/maps/?ll=${p.lon}%2C${p.lat}&z=16&pt=${p.lon}%2C${p.lat}`; if(tg?.openLink) tg.openLink(u); else window.open(u,"_blank");}
  else toast("🗺️ Ссылка на Яндекс Карты пока не добавлена");
}
function mapAll(){ if(places[0]) maps(places[0]); else toast("🗺️ Пока нет мест"); }
function save(id){
  const key="armenia_saved"; let saved=JSON.parse(localStorage.getItem(key)||"[]");
  if(saved.includes(id)){saved=saved.filter(x=>x!==id);toast("♡ Убрано из избранного")}
  else{saved.push(id);toast("❤️ Добавлено в избранное")}
  localStorage.setItem(key,JSON.stringify(saved)); render();
}
function nav(btn){document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));btn.classList.add("active");}
function renderCats(){
  document.getElementById("categories").innerHTML=cats.map(c=>`<button class="cat ${c===selected?"active":""}" onclick="selected='${esc(c).replace(/'/g,"\\'")}';render()">${c==="Все"?"✨ ":""}${esc(c)}</button>`).join("");
}
function render(){
  renderCats();
  const q=document.getElementById("search").value.trim().toLowerCase();
  const saved=JSON.parse(localStorage.getItem("armenia_saved")||"[]");
  const filtered=places.filter(p=>
    (selected==="Все"||p.category===selected) &&
    (!q || [p.name,p.category,p.region,p.short,p.description,p.nearby].join(" ").toLowerCase().includes(q))
  );
  document.getElementById("count").textContent=`${filtered.length} ${filtered.length===1?"место":"мест"}`;
  document.getElementById("empty").style.display=filtered.length?"none":"block";
  document.getElementById("cards").innerHTML=filtered.map(p=>{
    const img=p.photos.find(x=>x);
    const savedHere=saved.includes(p.id);
    const nearby=p.nearby ? p.nearby.split(";").map(x=>x.trim()).filter(Boolean).join(" · ") : "";
    return `<article class="card">
      <div class="photo" style="background-image:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.42)),url('${esc(img || "")}')">
        <div class="badge">${esc(p.category||"Место")}</div>
        <button class="save" onclick="save('${esc(p.id)}')">${savedHere?"♥":"♡"}</button>
      </div>
      <div class="body">
        <div class="title-row"><div><h2 class="title">${esc(p.name)}</h2><div class="loc">📍 ${esc(p.region)}</div></div><div class="rating">⭐ ${esc(p.rating||"—")}</div></div>
        <p class="desc">${esc(p.description||p.short)}</p>
        <div class="info">
          <div><div class="label">🎟️ Вход</div><div class="value">${esc(p.price||"Не указано")}</div></div>
          <div><div class="label">🕐 Часы</div><div class="value">${esc(p.hours||"Не указано")}</div></div>
          <div><div class="label">🚗 Как добраться</div><div class="value">${esc(p.how_to||"Не указано")}</div></div>
          <div><div class="label">⏱️ Время</div><div class="value">${esc(p.duration||"Не указано")}</div></div>
        </div>
        ${p.tip?`<div class="tip"><b>💡 Совет от Armenia Guide</b><br>${esc(p.tip)}</div>`:""}
        ${nearby?`<div class="nearby"><b>Что посмотреть рядом</b><br>${esc(nearby)}</div>`:""}
        <div class="buttons">
          <button class="btn primary" onclick='maps(${JSON.stringify(p)})'>🗺️ Яндекс Карты</button>
          <button class="btn secondary" onclick="save('${esc(p.id)}')">${savedHere?"♥ Сохранено":"♡ Сохранить"}</button>
        </div>
      </div>
    </article>`;
  }).join("");
}
render();
</script>
</body>
</html>
