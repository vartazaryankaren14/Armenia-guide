<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Armenia Guide — Проверка 231 фотографий</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#242422;background:#f7f6f1}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#faf9f7f0;padding:15px 20px;border-bottom:1px solid #ddd;backdrop-filter:blur(10px);z-index:3}h1{font-size:21px;margin:0 0 7px}p{margin:0 0 10px;color:#68665f;font-size:13px}input,select{background:white;color:#242422;border:1px solid #ccc;padding:10px;border-radius:9px;max-width:100%}main{max-width:1120px;margin:18px auto;padding:0 16px}.region{font-size:23px;margin:30px 0 10px;padding-top:12px;border-top:1px solid #ddd}.site{background:white;border-radius:15px;padding:14px;margin:12px 0;box-shadow:0 1px 7px #0001}.name{font-weight:700;font-size:17px;margin-bottom:4px}.minor{color:#777;font-size:12px;margin-bottom:12px}.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.photo{border-radius:10px;overflow:hidden;background:#f4f4f2}.photo img{width:100%;height:205px;object-fit:cover;display:block;background:#e4e1d9}.photo footer{font-size:12px;color:#656159;padding:8px}a{color:#8a4432}strong{font-weight:650}#status{color:#67635c;font-size:13px;margin-top:10px}.hidden{display:none}@media(max-width:650px){.photos{grid-template-columns:1fr}.photo img{height:230px}} </style></head><body><header><h1>Armenia Guide — фотокаталог</h1><p>Реальные фотографии, сохранённые в GitHub • 77 мест • обычно 3 ракурса; 5 для Парка Победы • соответствие объектам проверяется отдельно</p><input id="query" placeholder="Найти место..." aria-label="Поиск места"> <select id="region"><option value="">Все области</option></select> <div id="status"></div></header><main id="root"></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;'}[m]));
const root=document.getElementById('root'),region=document.getElementById('region'),query=document.getElementById('query');
let catalog=[];
async function load(){
 try{catalog=await fetch('catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('catalog.json недоступен');return r.json()});}
 catch(e){root.textContent='Ошибка загрузки каталога: '+e.message;return}
 const regions=[...new Set(catalog.map(x=>x.region))];
 for(const x of regions){let o=document.createElement('option');o.value=x;o.textContent=x;region.append(o)}

 function render(){
  const selected=catalog.filter(x=>(!region.value||x.region===region.value)&&(!query.value||x.name.toLowerCase().includes(query.value.toLowerCase())));
  document.getElementById('status').textContent='Показано '+selected.length+' из '+catalog.length+' мест. Проверяйте соответствие каждой фотографии реальному объекту.';
  root.replaceChildren();
  for(const p of selected){
   const card=document.createElement('article'); card.className='site';
   const name=document.createElement('div'); name.className='name'; name.textContent=p.name; card.append(name);
   const meta=document.createElement('div'); meta.className='minor'; meta.textContent=p.region+' · '+p.id;card.append(meta);
   const photos=document.createElement('div');photos.className='photos';
   for(let i=1;i<=(p.id==='ag_040'?5:3);i++){
    const path='images/places/'+p.id+'_'+i+'.webp';
    const item=document.createElement('div');item.className='photo';
    const link=document.createElement('a');link.href=path;link.target='_blank';link.rel='noopener';
    const picture=document.createElement('img');picture.loading='lazy';picture.src=path;picture.alt=p.name+' — фото '+i;
    picture.onerror=()=>{picture.style.opacity='.3';picture.alt='Фото отсутствует'};
    link.append(picture);item.append(link);
    const caption=document.createElement('footer');caption.textContent='Фото '+i;item.append(caption);
    photos.append(item);
   }
   card.append(photos);root.append(card);
  }
 }
 region.addEventListener('change',render);query.addEventListener('input',render);render();
}
load();
</script></body></html>
