name: Armenia Guide - Apply Curated Photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/photos-curated.yml'
      - 'photo-curation-reviewed.json'

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install requests pillow
      - name: Apply exact Commons photo sources
        run: python scripts/apply_reviewed_photos.py
      - name: Commit approved replacement photos and credits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/places PHOTO_SOURCES.md PHOTO_CURATION_RESULT.json
          if ! git diff --cached --quiet; then
            git commit -m "Replace mismatched photos with real place images"
            git push
          fi
