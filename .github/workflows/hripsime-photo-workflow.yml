name: Armenia Guide - selected real St Hripsime images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hripsime-photo-workflow.yml'
      - 'scripts/replace_hripsime_photos.py'
permissions:
  contents: write
jobs:
  replace-approved-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing dependencies
        run: python -m pip install requests pillow
      - name: Download and validate selected real photos
        run: python scripts/replace_hripsime_photos.py
      - name: Commit only the two updated image files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/places/ag_046_2.webp images/places/ag_046_3.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Install approved real Saint Hripsime interior and aerial photos'
            git push
          fi
