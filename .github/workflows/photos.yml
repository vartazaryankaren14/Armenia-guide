
name: Armenia Guide - Download Photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/photos.yml'

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install requests pillow

      - name: Download photos
        run: python scripts/download_photos.py

      - name: Save photos to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/places PHOTO_SOURCES.md PHOTO_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Add Armenia Guide photos"
            git push
