name: Armenia Guide - curated Tegher Monastery images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tegher-photo-workflow.yml'
      - 'scripts/replace_tegher_photos.py'
permissions:
  contents: write
jobs:
  update-tegher:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: python -m pip install requests pillow
      - name: Download and verify Tegher photos
        run: python scripts/replace_tegher_photos.py
      - name: Commit only the Tegher photo replacements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/places/ag_099_2.webp images/places/ag_099_3.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Install two distinct Tegher Monastery images'
            git push
          fi
